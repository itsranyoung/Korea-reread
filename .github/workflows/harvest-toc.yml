name: Harvest Korea Review TOCs
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/harvest_toc.py'
      - 'scripts/audit_catalog.py'
      - '.github/workflows/harvest-toc.yml'
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install extraction dependencies
        run: python -m pip install requests beautifulsoup4 lxml
      - name: Extract TOCs with legacy encoding support
        run: python scripts/harvest_toc.py
      - name: Check catalog coverage and duplicates
        run: python scripts/audit_catalog.py
      - name: Save extraction outputs for manual source comparison
        uses: actions/upload-artifact@v4
        with:
          name: korea-review-toc-harvest
          path: |
            audit/
            data/1902-draft.json
            data/1903-draft.json
            data/1905-draft.json
          if-no-files-found: warn
      - name: Commit reproducible draft reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f audit/ data/1902-draft.json data/1903-draft.json data/1905-draft.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Store provisional TOC extraction and catalog audit"
            git push
          fi
