name: Verify remaining Korea Review catalogs
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/verify_1903_catalog.py'
      - 'scripts/verify_1905_catalog.py'
      - '.github/workflows/verify-remaining-catalogs.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 1903 monthly source text
        run: python scripts/verify_1903_catalog.py
      - name: Verify 1905 monthly source text
        run: python scripts/verify_1905_catalog.py
      - name: Save provenance reports and candidate catalog files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/1903.json data/1905.json audit/1903-month-verification.json audit/1905-month-verification.json
          if ! git diff --cached --quiet; then
            git commit -m "Store provisional 1903 and 1905 source-correlated catalogs"
            git pull --rebase origin main
            git push
          fi
