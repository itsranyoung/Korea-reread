name: Extract selected 251 article OCR drafts
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extract-selected-articles.yml'
permissions:
  contents: write
concurrency:
  group: 251-article-transcription-main
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract body text from all 72 corrected-OCR monthly issues
        run: python scripts/extract_selected_articles.py
      - name: Save draft transcriptions without publishing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/transcriptions/ audit/transcription-boundary-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Save 251-article OCR drafts and boundary provenance audit"
            git push origin HEAD:main
          fi
