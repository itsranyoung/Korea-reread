name: Reconstruct 1902-1905 original monthly tables of contents
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/reconstruct_monthly_tocs_1902_1905.py'
      - '.github/workflows/reconstruct-tocs.yml'
concurrency:
  group: reconstruct-primary-source-tocs-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synchronize latest main before generating deterministic data
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Re-extract all 48 monthly original issue TOCs with explicit pages
        run: python scripts/reconstruct_monthly_tocs_1902_1905.py
      - name: Merge only evidence-backed issues into public catalog
        run: python scripts/build_verified_catalog.py
      - name: Commit primary-source evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monthly-toc-confirmed-1902-1905.json audit/monthly-toc-reconstruction/ data/public-verified.json audit/publication-decisions.json
          if ! git diff --cached --quiet; then
            git commit -m "Reconstruct monthly source TOCs and page evidence, 1902-1905"
            git push origin HEAD:main
          fi
